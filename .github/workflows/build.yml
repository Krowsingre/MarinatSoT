name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Show tools
        run: |
          xcodebuild -version
          swift --version

      - name: Test the game logic
        run: |
          set -o pipefail
          mkdir -p out
          swift test --package-path MarinCore 2>&1 | tee out/core-tests.log

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build the app for the simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project Marin.xcodeproj \
            -scheme Marin \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-full.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\* " | tee out/build.log

      - name: Take screenshots
        run: bash scripts/screenshots.sh 2>&1 | tee out/screenshots.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: out
          if-no-files-found: ignore

      # Keeps the latest results on a side branch so they can be looked at without signing in.
      - name: Publish results to the ci-results branch
        if: always() && github.event_name != 'pull_request'
        run: |
          mkdir -p out
          echo "${{ github.sha }} ${{ job.status }}" > out/status.txt
          cd out
          git init -q -b ci-results
          git add -A
          git -c user.name="ci" -c user.email="ci@users.noreply.github.com" commit -q -m "Results for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
